<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>星火西游 · 横版2D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#f7ead0;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:100vw;height:100vh;max-width:177.78vh;max-height:56.25vw;overflow:hidden;background:#20160f}
canvas{display:block;width:100%;height:100%;image-rendering:auto}
#tip{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:11px;color:#d9c6a2;opacity:.75;pointer-events:none}
</style>
</head>
<body>
<div id="app"><canvas id="game"></canvas><div id="tip">横屏体验 · 点击角色附近可移动 · 战斗中选择技能</div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');
let W=1280,H=720,D=devicePixelRatio||1;
function resize(){let r=Math.min(innerWidth/1280,innerHeight/720);W=Math.round(innerWidth/r);H=Math.round(innerHeight/r);c.width=innerWidth*D;c.height=innerHeight*D;x.setTransform(c.width/innerWidth,0,0,c.height/innerHeight,0,0); x.scale(innerWidth/W,innerHeight/H)}
addEventListener('resize',resize); resize();

const S={scene:'world',gold:1280,level:12,exp:72,hp:860,maxhp:860,mp:310,maxmp:310,petHp:520,enemyHp:[420,330,280],cam:0,heroX:380,move:0,turn:0,msg:'云州城外，妖气从古道尽头升起。',saveKey:'xinghuo2d'};
const hero={name:'玄曜',cls:'焰剑客',hair:0};
let particles=[], floaters=[], last=0, anim=0;

function rr(ctx,a,b,w,h,r){ctx.beginPath();ctx.roundRect(a,b,w,h,r);ctx.fill()}
function strokeRR(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r);x.stroke()}
function text(t,a,b,size=20,fill='#fff',align='left'){x.font=`${size}px "PingFang SC","Microsoft YaHei",sans-serif`;x.fillStyle=fill;x.textAlign=align;x.textBaseline='middle';x.fillText(t,a,b)}
function grad(a,b,c1,c2){let g=x.createLinearGradient(0,a,0,b);g.addColorStop(0,c1);g.addColorStop(1,c2);return g}
function panel(a,b,w,h){x.fillStyle='rgba(30,18,14,.88)';rr(x,a,b,w,h,14);x.strokeStyle='#b9975b';x.lineWidth=2;strokeRR(a,b,w,h,14)}
function bar(a,b,w,h,val,max,c1,c2){x.fillStyle='rgba(0,0,0,.55)';rr(x,a,b,w,h,h/2);x.fillStyle=grad(b,b+h,c1,c2);rr(x,a,b,Math.max(3,w*val/max),h,h/2)}

function cloud(cx,cy,s){x.fillStyle='rgba(245,239,215,.16)';for(let i=0;i<5;i++){x.beginPath();x.arc(cx+(i-2)*38*s,cy+(i%2)*8*s,28*s+(i%2)*8*s,0,7);x.fill()}}
function tree(px,py,s){x.fillStyle='#2e241b';x.fillRect(px-8*s,py,16*s,100*s);x.fillStyle='#263d2e';[[0,-35,46],[35,-10,35],[-32,-8,34],[5,8,40]].forEach(q=>{x.beginPath();x.arc(px+q[0]*s,py+q[1]*s,q[2]*s,0,7);x.fill()})}
function mountain(px,base,s,col){x.fillStyle=col;x.beginPath();x.moveTo(px-250*s,base);x.lineTo(px-80*s,base-170*s);x.lineTo(px+10*s,base-60*s);x.lineTo(px+110*s,base-210*s);x.lineTo(px+260*s,base);x.closePath();x.fill()}
function worldBg(){
 x.fillStyle=grad(0,H,'#171c32','#c18c67');x.fillRect(0,0,W,H);
 cloud(260,145,1);cloud(890,110,.8);
 mountain(240,530,1.4,'#343444');mountain(720,535,1.2,'#454152');mountain(1120,530,1.0,'#302f3d');
 x.fillStyle='#655544';x.fillRect(0,510,W,210);
 x.fillStyle='#80684b';x.beginPath();x.moveTo(0,590);x.bezierCurveTo(300,530,530,650,760,570);x.bezierCurveTo(980,500,1120,600,1280,540);x.lineTo(1280,720);x.lineTo(0,720);x.fill();
 for(let i=0;i<7;i++)tree(70+i*210,455+(i%2)*20,.75+(i%3)*.12);
 // distant gate
 x.fillStyle='#5b2f24';x.fillRect(1010,300,30,220);x.fillRect(1180,300,30,220);x.fillRect(1000,275,220,35);
 x.fillStyle='#bda46b';text('云州古道',1110,292,22,'#f3d9a0','center');
 // road stones
 x.fillStyle='rgba(31,22,17,.25)';for(let i=0;i<14;i++){x.beginPath();x.ellipse(i*105+20,655-(i%3)*12,50,12,0,0,7);x.fill()}
}

function sprite(px,py,scale,kind='hero',state='idle',frame=0,flip=false){
 x.save();x.translate(px,py);if(flip)x.scale(-1,1);x.scale(scale,scale);
 let bob=state==='idle'?Math.sin(anim/500+frame)*2:0;
 if(state==='hit')x.rotate(Math.sin(anim/70)*.06);
 // shadow
 x.fillStyle='rgba(0,0,0,.28)';x.beginPath();x.ellipse(0,4,42,12,0,0,7);x.fill();
 x.translate(0,bob);
 if(kind==='hero'){
   // cape
   x.fillStyle='#8c2927';x.beginPath();x.moveTo(-26,-95);x.quadraticCurveTo(-58,-20,-34,18);x.lineTo(12,10);x.lineTo(22,-84);x.closePath();x.fill();
   // robe
   x.fillStyle='#d8b878';x.beginPath();x.moveTo(-26,-75);x.lineTo(-43,20);x.quadraticCurveTo(0,38,43,20);x.lineTo(25,-75);x.closePath();x.fill();
   x.fillStyle='#53352b';x.beginPath();x.moveTo(-16,-68);x.lineTo(0,25);x.lineTo(16,-68);x.closePath();x.fill();
   // sleeves
   x.fillStyle='#9d302a';x.beginPath();x.roundRect(-48,-68,24,72,10);x.fill();x.beginPath();x.roundRect(24,-68,24,72,10);x.fill();
   // head
   x.fillStyle='#e7b58f';x.beginPath();x.arc(0,-92,27,0,7);x.fill();
   x.fillStyle='#171821';x.beginPath();x.arc(0,-104,29,Math.PI,0);x.lineTo(27,-91);x.quadraticCurveTo(12,-108,0,-101);x.quadraticCurveTo(-12,-108,-27,-91);x.closePath();x.fill();
   // hair tail
   x.fillStyle='#171821';x.beginPath();x.moveTo(23,-103);x.quadraticCurveTo(62,-74,34,-38);x.lineTo(18,-52);x.closePath();x.fill();
   // eyes
   x.fillStyle='#34231e';x.fillRect(-11,-93,6,3);x.fillRect(5,-93,6,3);
   // belt
   x.fillStyle='#a36c32';x.fillRect(-34,-10,68,9);
   // boots
   x.fillStyle='#2c2730';x.roundRect(-31,18,25,15,5);x.fill();x.roundRect(6,18,25,15,5);x.fill();
   // sword
   x.strokeStyle='#dbe5ee';x.lineWidth=5;x.beginPath();x.moveTo(42,-44);x.lineTo(78,-110);x.stroke();x.strokeStyle='#d5a34c';x.lineWidth=4;x.beginPath();x.moveTo(30,-37);x.lineTo(54,-25);x.stroke();
 }else if(kind==='pet'){
   x.fillStyle='#d8e8ee';x.beginPath();x.ellipse(0,-35,35,29,0,0,7);x.fill();
   x.fillStyle='#a6c7d5';x.beginPath();x.moveTo(-28,-48);x.lineTo(-52,-92);x.lineTo(-13,-69);x.closePath();x.fill();x.beginPath();x.moveTo(28,-48);x.lineTo(52,-92);x.lineTo(13,-69);x.closePath();x.fill();
   x.fillStyle='#263345';x.beginPath();x.arc(-11,-37,4,0,7);x.arc(11,-37,4,0,7);x.fill();
   x.fillStyle='#e7c2c7';x.beginPath();x.ellipse(0,-24,10,7,0,0,7);x.fill();
   x.fillStyle='#b9d7df';x.beginPath();x.ellipse(0,10,29,23,0,0,7);x.fill();
   x.fillStyle='#9bb7c1';x.beginPath();x.moveTo(-28,10);x.quadraticCurveTo(-62,28,-30,38);x.quadraticCurveTo(-5,30,-15,12);x.fill();
 }else{
   x.fillStyle=kind==='bandit'?'#493c55':'#45605a';x.beginPath();x.moveTo(-24,-70);x.lineTo(-43,20);x.quadraticCurveTo(0,36,43,20);x.lineTo(25,-70);x.closePath();x.fill();
   x.fillStyle='#d69d78';x.beginPath();x.arc(0,-88,25,0,7);x.fill();
   x.fillStyle='#1e2029';x.beginPath();x.arc(0,-98,28,Math.PI,0);x.fill();
   x.fillStyle='#e5d6a1';x.fillRect(-31,-68,62,8);
   x.fillStyle='#28242d';x.fillRect(-30,20,24,16);x.fillRect(6,20,24,16);
   if(kind==='monster'){x.fillStyle='#8b3e4b';x.beginPath();x.moveTo(-28,-110);x.lineTo(-42,-140);x.lineTo(-10,-118);x.moveTo(28,-110);x.lineTo(42,-140);x.lineTo(10,-118);x.fill()}
 }
 x.restore();
}

function nameplate(px,py,n,hp,max){
 text(n,px,py-135,16,'#f6e5c4','center');bar(px-48,py-123,96,7,hp,max,'#d75a4f','#8e2524')
}

function drawWorld(){
 worldBg();
 // shrine
 panel(28,28,270,86);text('星火西游 · 云州古道',48,56,22,'#f1d79b');text('Lv.'+S.level+'  '+hero.name+' · '+hero.cls,48,88,14,'#cbb58d');
 // player
 sprite(S.heroX,520,1.12,'hero','idle',0);nameplate(S.heroX,520,hero.name,S.hp,S.maxhp);
 sprite(520,570,.7,'pet','idle');text('灵狐',520,510,14,'#f0e2c6','center');
 // NPC
 sprite(760,520,.98,'bandit','idle');text('巡路校尉',760,380,15,'#f2d7ac','center');
 panel(650,410,220,58);text('「前方妖雾渐浓，慎行。」',760,439,15,'#ead9bd','center');
 // interaction cards
 panel(900,585,330,96);text('点击古道尽头进入战斗',920,610,16,'#f1d79b');text('金钱 '+S.gold+'  ·  灵狐 '+S.petHp+' HP',920,644,14,'#cbb58d');
 drawMobileControls();
}
function drawMobileControls(){
 panel(25,600,155,75);text('◀',62,637,34,'#e6d2ac','center');text('▶',143,637,34,'#e6d2ac','center');
}

function battleBg(){
 x.fillStyle=grad(0,H,'#151727','#4c3030');x.fillRect(0,0,W,H);
 for(let i=0;i<5;i++)mountain(100+i*300,520,1,'#29283a');
 x.fillStyle='#44362e';x.fillRect(0,510,W,210);
 x.fillStyle='#755642';x.fillRect(0,555,W,165);
 for(let i=0;i<10;i++){x.fillStyle='rgba(0,0,0,.14)';x.beginPath();x.ellipse(i*150+40,650,55,13,0,0,7);x.fill()}
 // moon
 x.fillStyle='#e6d6a8';x.beginPath();x.arc(1080,125,52,0,7);x.fill();
}
const enemies=[['赤羽妖姬','monster'],['山魈头领','bandit'],['雾灵','monster']];
function drawBattle(){
 battleBg();
 panel(25,22,1230,75);text('云州古道 · 妖雾战',48,50,22,'#f1d79b');text('第 '+(S.turn+1)+' 回合',1215,50,17,'#cbb58d','right');
 // turn order
 panel(430,105,420,46);text('行动序列  玄曜 → 灵狐 → 赤羽妖姬 → 山魈头领',640,128,14,'#dfcba7','center');
 sprite(280,540,1.22,'hero',S.turn===0?'idle':'idle');nameplate(280,540,hero.name,S.hp,S.maxhp);
 sprite(430,575,.78,'pet');bar(385,482,90,7,S.petHp,520,'#7bd6d2','#2b7e87');text('灵狐',430,468,14,'#f0e2c6','center');
 [820,980,1130].forEach((px,i)=>{let hp=S.enemyHp[i];sprite(px,520,.9,enemies[i][1],hp<=0?'hit':'idle');nameplate(px,520,enemies[i][0],hp,420)});
 // bottom command
 panel(25,590,1230,108);
 text('玄曜',52,616,18,'#f1d79b');bar(120,604,210,14,S.hp,S.maxhp,'#e85b53','#9d2525');text(S.hp+'/'+S.maxhp,335,612,13,'#e8d8bd','right');
 bar(120,632,210,11,S.mp,S.maxmp,'#62a8e5','#315c9a');text(S.mp+'/'+S.maxmp,335,638,13,'#e8d8bd','right');
 const skills=[['破军斩','普通攻击'],['炎龙诀','火焰法术'],['回春术','恢复生命'],['御剑阵','群体伤害']];
 skills.forEach((q,i)=>{let bx=390+i*205; x.fillStyle='rgba(84,51,34,.95)';rr(x,bx,604,180,72,12);x.strokeStyle='#a98755';x.lineWidth=1;strokeRR(bx,604,180,72,12);text(q[0],bx+90,627,18,'#f4dfb2','center');text(q[1],bx+90,653,12,'#bfae8e','center')});
}
function attack(i){
 if(S.enemyHp.every(v=>v<=0))return;
 if(i===0){S.enemyHp[0]=Math.max(0,S.enemyHp[0]-125);S.mp=Math.min(S.maxmp,S.mp+8);effect(820,450,'-125','#f0d36e')}
 if(i===1&&S.mp>=45){S.mp-=45;S.enemyHp[0]=Math.max(0,S.enemyHp[0]-190);effect(820,450,'-190','#ff7a4d')}
 if(i===2){S.hp=Math.min(S.maxhp,S.hp+170);effect(280,420,'+170','#78dca0')}
 if(i===3&&S.mp>=80){S.mp-=80;S.enemyHp=S.enemyHp.map(v=>Math.max(0,v-100));effect(980,400,'-100','#9e8cff')}
 S.turn++;
 setTimeout(()=>enemyTurn(),350);
}
function enemyTurn(){
 if(S.enemyHp.every(v=>v<=0)){S.msg='战斗胜利！获得 260 金、72 经验。';S.gold+=260;S.exp+=72;if(S.exp>=100){S.level++;S.exp-=100;S.maxhp+=80;S.hp=S.maxhp}return}
 let dmg=25+Math.floor(Math.random()*38);S.hp=Math.max(0,S.hp-dmg);effect(280,430,'-'+dmg,'#ff8b76');
 if(S.hp<=0){S.hp=S.maxhp;S.mp=S.maxmp;S.msg='玄曜倒下后被灵狐拖回安全处……';S.scene='world'}
}
function effect(px,py,t,col){floaters.push({x:px,y:py,t,col,life:1});for(let i=0;i<14;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*5,vy:(Math.random()-.8)*5,life:1,col})}

function draw(){
 x.clearRect(0,0,W,H);
 if(S.scene==='world')drawWorld();else drawBattle();
 // particles
 particles.forEach(p=>{x.globalAlpha=Math.max(0,p.life);x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,3+p.life*3,0,7);x.fill();p.x+=p.vx;p.y+=p.vy;p.life-=.035});particles=particles.filter(p=>p.life>0);x.globalAlpha=1;
 floaters.forEach(f=>{x.globalAlpha=f.life;text(f.t,f.x,f.y,24,f.col,'center');f.y-=.7;f.life-=.025});floaters=floaters.filter(f=>f.life>0);x.globalAlpha=1;
 if(S.msg){x.fillStyle='rgba(20,14,12,.7)';rr(x,350,520,580,46,20);text(S.msg,640,543,15,'#ead7b3','center')}
}
function loop(t){anim=t;draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);

c.addEventListener('pointerdown',e=>{
 const r=c.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width,py=(e.clientY-r.top)*H/r.height;
 if(S.scene==='world'){
   if(px>870&&py>540){S.scene='battle';S.msg='妖物拦路！选择技能迎战。';}
   else if(px<210&&py>580){S.heroX=Math.max(100,S.heroX-55)}
   else if(px<210&&py>580){S.heroX=Math.min(700,S.heroX+55)}
   else if(px<620){S.heroX=Math.min(700,S.heroX+35)}
 }else{
   if(py>595){
     if(px>390&&px<570)attack(0);
     else if(px>=570&&px<775)attack(1);
     else if(px>=775&&px<980)attack(2);
     else if(px>=980)attack(3);
   }
 }
});
addEventListener('keydown',e=>{
 if(S.scene==='world'&&(e.key==='ArrowRight'||e.key==='d'))S.heroX=Math.min(700,S.heroX+30);
 if(S.scene==='world'&&(e.key==='ArrowLeft'||e.key==='a'))S.heroX=Math.max(80,S.heroX-30);
 if(e.key==='Enter')S.scene='battle';
 if(S.scene==='battle'&&['1','2','3','4'].includes(e.key))attack(+e.key-1);
});
</script>
</body></html>
