<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>星火勇者 2.0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0b1020;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden}
button{font:inherit;border:0;border-radius:14px;padding:14px 16px;background:#263451;color:white;font-weight:700;touch-action:manipulation}
button:active{transform:scale(.98)}
button.primary{background:#7c3aed}
button.good{background:#15803d}
button.warn{background:#b45309}
button:disabled{opacity:.45}
#app{max-width:720px;margin:auto;min-height:100vh;padding:16px}
.screen{display:none}.screen.active{display:block}
.card{background:#141d33;border:1px solid #293653;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px #0003}
h1,h2,h3{margin:0 0 12px}
h1{font-size:34px;text-align:center;margin-top:30px}
.sub{text-align:center;color:#aab6d0;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.class{cursor:pointer;text-align:center;min-height:150px}
.class.selected{outline:3px solid #a78bfa;background:#211c3b}
.icon{font-size:42px;margin-bottom:8px}
.muted{color:#9aa8c2;font-size:13px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
.stat{background:#0f172a;border-radius:12px;padding:9px;text-align:center;font-size:12px}
.stat b{display:block;font-size:16px;margin-top:3px}
.bar{height:10px;background:#0b1222;border-radius:99px;overflow:hidden;margin:5px 0 10px}
.fill{height:100%;transition:width .25s}
.hp{background:#ef4444}.mp{background:#3b82f6}.xp{background:#a78bfa}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.log{height:180px;overflow:auto;background:#090e1a;border-radius:14px;padding:12px;font-size:13px;line-height:1.65}
.enemy{text-align:center;font-size:56px;padding:10px}
.mapbtn{display:flex;align-items:center;gap:12px;text-align:left;width:100%;margin-bottom:9px}
.mapbtn span:last-child{margin-left:auto}
.shopitem{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #293653}
nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#0b1020ee;padding:10px 0 calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
.small{padding:10px 12px;font-size:13px}
.notice{padding:10px 12px;background:#1e293b;border-radius:12px;color:#cbd5e1;font-size:13px}
@media(max-width:390px){#app{padding:12px}.grid3{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app">
<section id="start" class="screen active">
  <h1>🔥 星火勇者</h1>
  <div class="sub">iPhone 回合制 RPG · 2.0</div>
  <div class="card">
    <h3>选择你的职业</h3>
    <div class="grid3" id="classes"></div>
  </div>
  <button class="primary" style="width:100%" onclick="startGame()">开始冒险</button>
  <button style="width:100%;margin-top:10px" onclick="loadGame()">读取存档</button>
  <p class="muted" style="text-align:center;margin-top:18px">存档保存在本机浏览器中</p>
</section>

<section id="game" class="screen">
  <div class="row"><h2>星火勇者</h2><button class="small" onclick="saveGame()">💾 保存</button></div>
  <div class="card" id="hero"></div>
  <div id="page"></div>
  <nav>
    <button onclick="showPage('battle')">⚔️ 战斗</button>
    <button onclick="showPage('map')">🗺️ 地图</button>
    <button onclick="showPage('shop')">🛒 商店</button>
  </nav>
</section>
</div>
<script>
const classes=[
 {id:'knight',name:'烈焰骑士',icon:'🔥',desc:'高生命、高防御，技能造成强力火焰伤害',hp:130,mp:35,atk:18,def:10,skill:'烈焰斩'},
 {id:'mage',name:'星术师',icon:'✨',desc:'高魔力，技能伤害最高',hp:90,mp:70,atk:12,def:6,skill:'星陨术'},
 {id:'ranger',name:'暗影游侠',icon:'🏹',desc:'攻击较高，有机会造成暴击',hp:105,mp:50,atk:16,def:7,skill:'暗影箭'}
];
let C=classes[0], P, stage='forest', enemy=null, selected='knight', page='battle';

const enemies={
 forest:[['🍃','森林史莱姆',48,8,3,16],['🐺','灰狼',62,11,4,20],['👺','哥布林',75,13,5,25]],
 desert:[['🦂','赤沙蝎',90,16,7,32],['🧟','荒原亡魂',105,18,8,38],['🐍','沙蛇',82,20,6,35]],
 castle:[['🧛','暗影骑士',140,23,11,55],['👹','魔将',175,27,13,70],['🐉','暗夜魔龙',280,34,16,150]]
};
function $(id){return document.getElementById(id)}
function initClasses(){
 $('classes').innerHTML=classes.map(c=>`<div class="card class ${c.id===selected?'selected':''}" onclick="selectClass('${c.id}')"><div class="icon">${c.icon}</div><b>${c.name}</b><div class="muted">${c.desc}</div></div>`).join('');
}
function selectClass(id){selected=id;C=classes.find(x=>x.id===id);initClasses()}
function startGame(){
 P={name:C.name,level:1,maxHp:C.hp,hp:C.hp,maxMp:C.mp,mp:C.mp,atk:C.atk,def:C.def,xp:0,next:70,gold:80,potions:3,weapon:0,armor:0};
 stage='forest';page='battle';enemy=null;showGame();newBattle();
}
function showGame(){$('start').classList.remove('active');$('game').classList.add('active');showPage(page)}
function saveGame(){
 if(!P)return;
 localStorage.setItem('sparkHeroSave',JSON.stringify({P,stage}));
 toast('存档成功！');
}
function loadGame(){
 try{
  const s=JSON.parse(localStorage.getItem('sparkHeroSave'));
  if(!s) throw 0;
  P=s.P;stage=s.stage||'forest';C=classes.find(x=>x.name===P.name)||classes[0];page='battle';showGame();newBattle();toast('已读取存档');
 }catch(e){toast('没有找到存档')}
}
function toast(t){let n=document.createElement('div');n.className='notice';n.textContent=t;n.style.position='fixed';n.style.left='16px';n.style.right='16px';n.style.bottom='86px';n.style.zIndex=9;document.body.appendChild(n);setTimeout(()=>n.remove(),1500)}
function showPage(p){page=p;$('page').innerHTML='';if(p==='battle')renderBattle();if(p==='map')renderMap();if(p==='shop')renderShop();renderHero()}
function renderHero(){
 $('hero').innerHTML=`<div class="row"><b>${C.icon} ${P.name} Lv.${P.level}</b><span>💰 ${P.gold}　🧪 ${P.potions}</span></div>
 <div class="muted">生命 ${P.hp}/${P.maxHp}</div><div class="bar"><div class="fill hp" style="width:${P.hp/P.maxHp*100}%"></div></div>
 <div class="muted">魔力 ${P.mp}/${P.maxMp}</div><div class="bar"><div class="fill mp" style="width:${P.mp/P.maxMp*100}%"></div></div>
 <div class="muted">经验 ${P.xp}/${P.next}</div><div class="bar"><div class="fill xp" style="width:${P.xp/P.next*100}%"></div></div>
 <div class="stats"><div class="stat">攻击<b>${P.atk}</b></div><div class="stat">防御<b>${P.def}</b></div><div class="stat">武器<b>+${P.weapon}</b></div><div class="stat">护甲<b>+${P.armor}</b></div></div>`;
}
function newBattle(){
 let list=enemies[stage], e=list[Math.floor(Math.random()*list.length)];
 enemy={icon:e[0],name:e[1],maxHp:e[2],hp:e[2],atk:e[3],def:e[4],xp:e[5]};
 showPage('battle');
}
function renderBattle(){
 if(!enemy){$('page').innerHTML='<div class="card"><h3>准备战斗</h3><button class="primary" onclick="newBattle()">寻找敌人</button></div>';return}
 $('page').innerHTML=`<div class="card"><div class="muted">${stageName()} · ${enemy.name}</div><div class="enemy">${enemy.icon}</div>
 <div style="text-align:center"><b>${enemy.name}</b>　${enemy.hp}/${enemy.maxHp}</div>
 <div class="bar"><div class="fill hp" style="width:${enemy.hp/enemy.maxHp*100}%"></div></div></div>
 <div class="card"><div class="actions">
 <button onclick="attack()">⚔️ 普通攻击</button>
 <button onclick="skill()">✨ ${C.skill}</button>
 <button onclick="defend()">🛡️ 防御</button>
 <button onclick="potion()">🧪 使用药水</button></div></div>
 <div class="card"><div class="log" id="log">${window.battleLog||'战斗开始！'}</div></div>`;
}
function stageName(){return stage==='forest'?'迷雾森林':stage==='desert'?'赤砂荒原':'魔王城'}
function log(t){window.battleLog=(window.battleLog||'')+'<br>'+t;renderBattle();renderHero()}
function hit(dmg){
 const crit=Math.random()< (C.id==='ranger'?0.25:0.12); if(crit)dmg=Math.floor(dmg*1.7);
 enemy.hp=Math.max(0,enemy.hp-dmg);return [dmg,crit];
}
function attack(){
 let [d,crit]=hit(Math.max(1,P.atk+P.weapon+Math.floor(Math.random()*7)-enemy.def));
 log(`你造成 <b>${d}</b> 点伤害${crit?'（暴击！）':''}`);
 if(enemy.hp<=0)return win();
 enemyTurn();
}
function skill(){
 const cost=15;if(P.mp<cost){toast('魔力不足');return}
 P.mp-=cost;let mult=C.id==='mage'?2.2:C.id==='knight'?1.8:1.95;
 let [d,crit]=hit(Math.max(1,Math.floor((P.atk+P.weapon)*mult+Math.random()*8-enemy.def)));
 log(`✨ ${C.skill} 造成 <b>${d}</b> 点伤害${crit?'（暴击！）':''}`);
 if(enemy.hp<=0)return win();enemyTurn();
}
function defend(){P._guard=1;log('🛡️ 你进入防御姿态。');enemyTurn()}
function potion(){
 if(P.potions<=0){toast('没有药水了');return}
 P.potions--;P.hp=Math.min(P.maxHp,P.hp+Math.floor(P.maxHp*.38));P.mp=Math.min(P.maxMp,P.mp+12);log('🧪 恢复生命与魔力。');enemyTurn()
}
function enemyTurn(){
 let d=Math.max(1,enemy.atk+Math.floor(Math.random()*6)-P.def-Math.floor(P.armor/2));
 if(P._guard){d=Math.floor(d*.45);P._guard=0}
 P.hp=Math.max(0,P.hp-d);log(`👹 ${enemy.name} 反击，造成 <b>${d}</b> 点伤害`);
 if(P.hp<=0){alert('你倒下了……');P.hp=Math.ceil(P.maxHp*.5);P.mp=Math.ceil(P.maxMp*.5);enemy=null;showPage('battle')}
}
function win(){
 P.xp+=enemy.xp;P.gold+=Math.floor(enemy.xp*1.4);log(`🎉 击败 ${enemy.name}！获得 ${enemy.xp} XP。`);
 while(P.xp>=P.next){P.xp-=P.next;P.level++;P.next=Math.floor(P.next*1.35);P.maxHp+=18;P.maxMp+=8;P.atk+=4;P.def+=2;P.hp=P.maxHp;P.mp=P.maxMp}
 setTimeout(()=>{enemy=null;newBattle()},500);
}
function renderMap(){
 const unlocked=P.level>=2, boss=P.level>=4;
 $('page').innerHTML=`<div class="card"><h3>🗺️ 世界地图</h3>
 <button class="mapbtn ${stage==='forest'?'primary':''}" onclick="travel('forest')">🌲 迷雾森林 <span>Lv.1+</span></button>
 <button class="mapbtn ${stage==='desert'?'primary':''}" ${unlocked?'':'disabled'} onclick="travel('desert')">🏜️ 赤砂荒原 <span>Lv.2+</span></button>
 <button class="mapbtn ${stage==='castle'?'primary':''}" ${boss?'':'disabled'} onclick="travel('castle')">🏰 魔王城 <span>Lv.4+</span></button>
 <div class="notice">提升等级后解锁新的区域。魔王城中的敌人经验和金币更多。</div></div>`;
}
function travel(s){stage=s;enemy=null;showPage('battle');newBattle()}
function renderShop(){
 $('page').innerHTML=`<div class="card"><h3>🛒 星火商店</h3>
 <div class="shopitem"><span>🧪 回复药水<br><small>恢复约 38% HP + 12 MP</small></span><button onclick="buyPotion()">20💰</button></div>
 <div class="shopitem"><span>⚔️ 精炼武器<br><small>攻击 +8</small></span><button onclick="buyWeapon()">120💰</button></div>
 <div class="shopitem"><span>🛡️ 星纹护甲<br><small>防御 +6</small></span><button onclick="buyArmor()">120💰</button></div></div>`;
}
function buyPotion(){if(P.gold<20)return toast('金币不足');P.gold-=20;P.potions++;renderShop();renderHero()}
function buyWeapon(){if(P.gold<120)return toast('金币不足');P.gold-=120;P.weapon+=8;renderShop();renderHero()}
function buyArmor(){if(P.gold<120)return toast('金币不足');P.gold-=120;P.armor+=6;renderShop();renderHero()}
initClasses();
</script>
</body>
</html>
