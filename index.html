<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17130f">
<link rel="manifest" href="manifest.json">
<title>星火西游</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0b09;color:#f4e4c2;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#18130f}
#rotate{display:none;position:fixed;inset:0;z-index:20;background:#111;color:#f5dfad;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px}
@media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas><div id="rotate">请将 iPhone 横过来<br><small>横屏体验游戏</small></div>
<script>
'use strict';
const C=document.getElementById('game'),ctx=C.getContext('2d');
let vw=innerWidth,vh=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){vw=innerWidth;vh=innerHeight;C.width=vw*dpr;C.height=vh*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)} addEventListener('resize',resize);resize();

const G={scene:'town',heroX:310,heroY:465,cam:0,dir:1,walk:false,turn:1,selected:0,msg:'长安城外的古道传来妖气。',gold:158760,level:28,exp:28634,next:82000,hp:1258,maxhp:1258,mp:682,maxmp:682,pet:980,petMax:980,enemy:[{n:'山妖',hp:760,max:760,type:0},{n:'小妖',hp:520,max:520,type:1},{n:'野狼',hp:430,max:430,type:2}],log:['[世界] 月下独酌：有人组队刷大雁塔吗？','[队伍] 江湖小虾：收高敏男鬼，价格好说！'],fx:[],float:[],saving:false};
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key>='1'&&e.key<='5'&&G.scene==='battle')skill(+e.key-1);if(e.key==='Escape')G.scene='town'});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function font(n){return `${n}px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif`}
function txt(s,x,y,n=16,col='#f5e4c2',align='left'){ctx.font=font(n);ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function panel(x,y,w,h,a=.86){ctx.fillStyle=`rgba(20,16,13,${a})`;ctx.fillRect(x,y,w,h);ctx.strokeStyle='#8f774b';ctx.lineWidth=1.5;ctx.strokeRect(x+.5,y+.5,w-1,h-1)}
function bar(x,y,w,h,v,m,c1,c2){ctx.fillStyle='#171310';ctx.fillRect(x,y,w,h);let p=Math.max(0,Math.min(1,v/Math.max(1,m)));let g=ctx.createLinearGradient(x,y,x+w,y);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(x,y,w*p,h);ctx.strokeStyle='#9a8051';ctx.strokeRect(x+.5,y+.5,w-1,h-1)}
function button(x,y,w,h,label,sub,fn){ctx.fillStyle='rgba(61,44,30,.96)';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#a58a57';ctx.strokeRect(x+.5,y+.5,w-1,h-1);txt(label,x+w/2,y+h*.42,17,'#f6dfad','center');if(sub)txt(sub,x+w/2,y+h*.73,11,'#bfae8e','center');return [x,y,w,h,fn]}
function hit(px,py,r){return px>=r[0]&&py>=r[1]&&px<=r[0]+r[2]&&py<=r[1]+r[3]}

function sky(){let g=ctx.createLinearGradient(0,0,0,vh);g.addColorStop(0,'#182033');g.addColorStop(.62,'#9d7057');g.addColorStop(1,'#d2a56d');ctx.fillStyle=g;ctx.fillRect(0,0,vw,vh)}
function mountain(x,y,s,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x-250*s,y);ctx.lineTo(x-90*s,y-190*s);ctx.lineTo(x+10*s,y-80*s);ctx.lineTo(x+120*s,y-220*s);ctx.lineTo(x+280*s,y);ctx.closePath();ctx.fill()}
function tree(x,y,s){ctx.fillStyle='#35251d';ctx.fillRect(x-5*s,y,10*s,90*s);ctx.fillStyle='#20372c';[[0,-35,42],[-28,-5,32],[28,-5,32],[0,5,38]].forEach(a=>{ctx.beginPath();ctx.arc(x+a[0]*s,y+a[1]*s,a[2]*s,0,7);ctx.fill()})}
function drawTown(){
 sky();for(let i=0;i<6;i++)mountain(100+i*260,470,1,'#3b3945');
 ctx.fillStyle='#67513d';ctx.fillRect(0,475,vw,vh-475);
 ctx.fillStyle='#8c7252';ctx.beginPath();ctx.moveTo(0,560);ctx.quadraticCurveTo(vw*.4,490,vw,555);ctx.lineTo(vw,vh);ctx.lineTo(0,vh);ctx.fill();
 for(let i=0;i<9;i++)tree(i*180+80,390+(i%2)*25,.65);
 // city gate
 ctx.fillStyle='#593126';ctx.fillRect(760,250,38,240);ctx.fillRect(1070,250,38,240);ctx.fillRect(740,225,390,55);ctx.fillStyle='#b28b4d';ctx.fillRect(770,240,330,5);txt('长安古道',935,252,23,'#f2d69c','center');
 // bridge/water
 ctx.fillStyle='#354d55';ctx.fillRect(0,470,220,65);ctx.fillStyle='#5f7b79';ctx.fillRect(0,488,220,28);
 for(let i=0;i<6;i++){ctx.fillStyle='#927850';ctx.fillRect(i*40,455,28,10)}
 // lanterns
 for(let i=0;i<5;i++){let px=680+i*110;ctx.strokeStyle='#32251c';ctx.beginPath();ctx.moveTo(px,290,px,355);ctx.stroke();ctx.fillStyle='#b84e38';ctx.beginPath();ctx.ellipse(px,365,15,20,0,0,7);ctx.fill()}
 // HUD
 panel(14,14,310,72);txt('星火西游',30,38,22,'#f1d49b');txt(`Lv.${G.level}  江湖小虾  ·  逍遥门`,30,67,13,'#c8b28d');
 panel(vw-235,14,221,72);txt(`银两  ${G.gold.toLocaleString()}`,vw-218,38,15,'#ecd4a2');txt(`经验  ${G.exp}/${G.next}`,vw-218,65,13,'#c8b28d');
 // player and pet
 drawChar(G.heroX-G.cam,G.heroY,1.0,'hero',G.walk); drawName(G.heroX-G.cam,G.heroY,'江湖小虾',G.hp,G.maxhp);
 drawPet(445-G.cam,510,0.72);txt('灵狐',445-G.cam,450,13,'#ead8b2','center');
 // NPCs
 drawChar(620-G.cam,465,.9,'npc',false);txt('任务使者',620-G.cam,355,14,'#f1d49b','center');
 drawChar(930-G.cam,470,.9,'npc2',false);txt('杂货商',930-G.cam,360,14,'#f1d49b','center');
 // interaction
 panel(vw-340,vh-120,325,100);txt('古道尽头',vw-320,vh-90,16,'#f0d39a');txt('点击「进入战斗」开始野外遇怪',vw-320,vh-60,13,'#c5b18f');
 button(vw-180,vh-54,145,40,'进入战斗','',()=>startBattle());
 // left menu
 panel(14,104,118,258);['任务','队伍','好友','帮派','背包','系统'].forEach((s,i)=>{button(24,114+i*39,98,31,s,'',()=>{G.msg=s+'功能将在后续版本开放';})});
 // chat
 panel(14,vh-108,440,92,.88);G.log.slice(-3).forEach((s,i)=>txt(s,25,vh-90+i*22,12,s.includes('[系统]')?'#dfc66d':'#b9d5e0'));txt('点击场景移动 · Enter进入战斗',470,vh-28,12,'#b7a98d');
}
function drawChar(px,py,s,kind,walk){ctx.save();ctx.translate(px,py);ctx.scale(s*(G.dir<0?-1:1),s);let bob=walk?Math.sin(Date.now()/100)*3:Math.sin(Date.now()/600)*1.5;
 ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,8,37,10,0,0,7);ctx.fill();ctx.translate(0,bob);
 let robe=kind==='hero'?'#b98547':kind==='npc2'?'#5b7890':'#6e4254';
 ctx.fillStyle=robe;ctx.beginPath();ctx.moveTo(-25,-76);ctx.lineTo(-42,20);ctx.quadraticCurveTo(0,35,42,20);ctx.lineTo(25,-76);ctx.closePath();ctx.fill();
 ctx.fillStyle=kind==='hero'?'#ead7ad':'#d5b58d';ctx.beginPath();ctx.arc(0,-92,25,0,7);ctx.fill();
 ctx.fillStyle='#1d1b20';ctx.beginPath();ctx.arc(0,-105,29,Math.PI,0);ctx.lineTo(27,-90);ctx.quadraticCurveTo(10,-105,0,-99);ctx.quadraticCurveTo(-12,-105,-27,-90);ctx.closePath();ctx.fill();
 ctx.fillStyle='#30221e';ctx.fillRect(-10,-94,5,3);ctx.fillRect(5,-94,5,3);
 ctx.fillStyle='#9c6933';ctx.fillRect(-31,-10,62,8);
 ctx.fillStyle='#292630';ctx.fillRect(-28,20,22,15);ctx.fillRect(6,20,22,15);
 if(kind==='hero'){ctx.strokeStyle='#d9e8ed';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(34,-40);ctx.lineTo(72,-112);ctx.stroke();ctx.strokeStyle='#d1a04e';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(24,-35);ctx.lineTo(50,-23);ctx.stroke()}
 ctx.restore()}
function drawPet(px,py,s){ctx.save();ctx.translate(px,py);ctx.scale(s,s);ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,10,30,8,0,0,7);ctx.fill();ctx.fillStyle='#dbeaf0';ctx.beginPath();ctx.ellipse(0,-35,31,25,0,0,7);ctx.fill();ctx.fillStyle='#a9cbd6';ctx.beginPath();ctx.moveTo(-25,-47);ctx.lineTo(-50,-86);ctx.lineTo(-10,-66);ctx.moveTo(25,-47);ctx.lineTo(50,-86);ctx.lineTo(10,-66);ctx.fill();ctx.fillStyle='#263443';ctx.fillRect(-12,-37,5,4);ctx.fillRect(7,-37,5,4);ctx.fillStyle='#caa0aa';ctx.beginPath();ctx.ellipse(0,-25,9,5,0,0,7);ctx.fill();ctx.restore()}
function drawName(px,py,n,hp,max){txt(n,px,py-136,14,'#f2dfb8','center');bar(px-48,py-125,96,7,hp,max,'#d75b4f','#8c2625')}

function startBattle(){G.scene='battle';G.turn=1;G.enemy=[{n:'山妖',hp:760,max:760,type:0},{n:'小妖',hp:520,max:520,type:1},{n:'野狼',hp:430,max:430,type:2}];G.msg='妖物拦路！请选择行动。'}
function drawEnemy(px,py,s,type,dead){ctx.save();ctx.translate(px,py);ctx.scale(s, s);ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,8,38,10,0,0,7);ctx.fill();ctx.fillStyle=type===0?'#3e5b62':type===1?'#704047':'#59605b';ctx.beginPath();ctx.moveTo(-28,-70);ctx.lineTo(-43,20);ctx.quadraticCurveTo(0,34,43,20);ctx.lineTo(28,-70);ctx.closePath();ctx.fill();ctx.fillStyle=type===2?'#6d5949':'#aa7056';ctx.beginPath();ctx.arc(0,-88,24,0,7);ctx.fill();ctx.fillStyle='#1d2025';ctx.beginPath();ctx.arc(0,-99,27,Math.PI,0);ctx.fill();if(type===0){ctx.fillStyle='#8f4245';ctx.beginPath();ctx.moveTo(-18,-108);ctx.lineTo(-42,-136);ctx.lineTo(-9,-116);ctx.moveTo(18,-108);ctx.lineTo(42,-136);ctx.lineTo(9,-116);ctx.fill()}ctx.fillStyle='#28242c';ctx.fillRect(-28,20,22,15);ctx.fillRect(6,20,22,15);if(dead){ctx.globalAlpha=.28;ctx.rotate(-.7)}ctx.restore()}
function drawBattle(){
 let g=ctx.createLinearGradient(0,0,0,vh);g.addColorStop(0,'#151a2a');g.addColorStop(.7,'#55423b');g.addColorStop(1,'#201813');ctx.fillStyle=g;ctx.fillRect(0,0,vw,vh);
 for(let i=0;i<5;i++)mountain(120+i*270,480,1,'#2f303d');ctx.fillStyle='#4d3b2e';ctx.fillRect(0,490,vw,vh-490);
 panel(14,14,vw-28,64);txt('云州古道 · 野外战斗',32,38,21,'#efd39a');txt(`第 ${G.turn} 回合`,vw-32,38,16,'#c7b18c','right');
 // characters
 drawChar(260,470,1.1,'hero',false);drawName(260,470,'江湖小虾',G.hp,G.maxhp);drawPet(410,505,.78);
 G.enemy.forEach((e,i)=>{let px=760+i*165;drawEnemy(px,465,.95,e.type,e.hp<=0);txt(e.n,px,330,14,'#e9d4a9','center');bar(px-45,342,90,7,e.hp,e.max,'#d55c51','#852727')});
 // bottom
 panel(14,vh-155,vw-28,140,.95);txt('江湖小虾',30,vh-132,16,'#f0d29a');bar(115,vh-142,190,12,G.hp,G.maxhp,'#e45d53','#982625');txt(`${G.hp}/${G.maxhp}`,315,vh-136,12,'#cbb693');bar(115,vh-118,190,10,G.mp,G.maxmp,'#66a9df','#315b95');txt(`${G.mp}/${G.maxmp}`,315,vh-113,12,'#cbb693');
 const names=[['攻击','普通攻击'],['法术','技能/法术'],['道具','恢复/消耗品'],['防御','减少伤害'],['自动','自动行动']];let bw=Math.min(150,(vw-360)/5),sx=350;
 names.forEach((a,i)=>button(sx+i*(bw+8),vh-140,bw,58,a[0],a[1],()=>skill(i)));
 txt(G.msg,30,vh-82,13,'#c8b795');
}
function skill(i){
 if(G.scene!=='battle'||G.enemy.every(e=>e.hp<=0))return;
 if(i===0){G.enemy[0].hp=Math.max(0,G.enemy[0].hp-150);G.float.push({x:760,y:300,t:'-150',c:'#f0d36e'});G.mp=Math.min(G.maxmp,G.mp+12)}
 if(i===1&&G.mp>=80){G.mp-=80;G.enemy.forEach((e,j)=>e.hp=Math.max(0,e.hp-(j===0?220:120)));G.float.push({x:920,y:300,t:'炎龙诀',c:'#ff8a4d'})}
 if(i===2){let heal=Math.min(240,G.maxhp-G.hp);G.hp+=heal;G.mp=Math.min(G.maxmp,G.mp+20);G.float.push({x:260,y:300,t:'+'+heal,c:'#78dca0'})}
 if(i===3){G.hp=Math.min(G.maxhp,G.hp+70);G.msg='玄曜摆出防御姿态。'}
 if(i===4){G.enemy[0].hp=Math.max(0,G.enemy[0].hp-120);G.msg='自动战斗：发动攻击。'}
 G.turn++;
 if(G.enemy.every(e=>e.hp<=0)){G.gold+=800;G.exp+=5200;G.msg='战斗胜利！获得 800 银两、5200 经验。';if(G.exp>=G.next){G.level++;G.exp-=G.next;G.next=Math.floor(G.next*1.15);G.maxhp+=120;G.maxmp+=60;G.hp=G.maxhp;G.mp=G.maxmp}return}
 setTimeout(()=>enemyAct(),350)
}
function enemyAct(){if(G.scene!=='battle')return;let dmg=35+Math.floor(Math.random()*55);G.hp=Math.max(0,G.hp-dmg);G.float.push({x:260,y:300,t:'-'+dmg,c:'#ff8d78'});if(G.hp<=0){G.hp=G.maxhp;G.mp=G.maxmp;G.scene='town';G.msg='你被妖物击倒，回到了长安城。'}}
function save(){try{localStorage.setItem('xinghuo-save',JSON.stringify(G));G.msg='游戏进度已保存。'}catch(e){G.msg='当前浏览器未允许本地存档。'}}
function load(){try{let s=JSON.parse(localStorage.getItem('xinghuo-save'));if(s)Object.assign(G,s);G.msg='已读取本地存档。'}catch(e){G.msg='没有可读取的存档。'}}
function draw(){ctx.clearRect(0,0,vw,vh);if(G.scene==='town')drawTown();else drawBattle();G.float.forEach(f=>{txt(f.t,f.x,f.y,22,f.c,'center');f.y-=.7});G.float=G.float.filter(f=>f.y>160);requestAnimationFrame(draw)}
C.addEventListener('pointerdown',e=>{
 let r=C.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
 if(G.scene==='town'){
   if(px>vw-205&&py>vh-75){startBattle();return}
   if(px<160&&py>vh-85){G.heroX=Math.max(90,G.heroX-70);G.dir=-1}
   else if(px<300&&py>vh-85){G.heroX=Math.min(620,G.heroX+70);G.dir=1}
   else if(px>vw*.72&&py>300){startBattle()}
   else if(px<vw*.62){G.heroX=Math.max(90,Math.min(620,px+G.cam));G.dir=px+G.cam>G.heroX?1:-1}
 }else{
   const bw=Math.min(150,(vw-360)/5),sx=350;
   for(let i=0;i<5;i++)if(hit(px,py,[sx+i*(bw+8),vh-140,bw,58])){skill(i);return}
 }
});
setInterval(()=>{if(G.scene==='town'){if(keys['arrowleft']||keys['a']){G.heroX=Math.max(80,G.heroX-3);G.dir=-1;G.walk=true}else if(keys['arrowright']||keys['d']){G.heroX=Math.min(650,G.heroX+3);G.dir=1;G.walk=true}else G.walk=false}},16);
addEventListener('beforeunload',save);
load();
requestAnimationFrame(draw);
</script>
</body>
</html>
